# Every push runs the self-tests on a clean machine, where this checkout is
# ~/.claude, the tree the scripts were written for. A push to main then
# publishes the site: this commit's files.
name: selftest
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    outputs:
      site: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@v7
      - name: Make this checkout ~/.claude
        run: rm -rf "$HOME/.claude" && ln -s "$GITHUB_WORKSPACE" "$HOME/.claude"
      # The tools the self-tests run on, at the versions they run on at home:
      # the pinned shellcheck, ReportLab for gist.py, pytest and pytest-cov for
      # change_gate.py's Python runner, uv for the parser gh_pr_structure.py
      # fetches, and cargo-mutants for change_gate.py's live Rust case on the
      # image's own rustup and cargo. The cargo-mutants digest is the one
      # GitHub records for that release asset.
      - name: Install what the self-tests need
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.claude/scripts/install_shellcheck.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-reportlab python3-pytest python3-pytest-cov
          pipx install uv==0.10.3
          mutants="$RUNNER_TEMP/cargo-mutants.tar.gz"
          curl -fsSL -o "$mutants" https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  $mutants" | sha256sum -c -
          tar -xzf "$mutants" -C "$HOME/.local/bin" cargo-mutants
      - name: Run every self-test
        id: tests
        run: |
          set +e
          ~/.claude/scripts/selftest.sh --copy | tee "$RUNNER_TEMP/selftest.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # The site is built whatever the tests said, so the page never waits on
      # a red run; the job still fails on it below.
      - name: Build the site
        if: always()
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          git archive HEAD | tar -x -C "$site"
      - id: site
        uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: ${{ runner.temp }}/site
      # Every tool a self-test calls is installed above, so a skipped case here
      # means one went missing.
      - name: Every self-test passed, none skipped
        run: |
          if grep 'skipped:' "$RUNNER_TEMP/selftest.log"; then
            echo "a self-test skipped a case: a tool it calls is not installed here"
            exit 1
          fi
          exit "${{ steps.tests.outputs.status }}"
  publish:
    needs: selftest
    if: always() && github.ref == 'refs/heads/main' && needs.selftest.outputs.site == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
