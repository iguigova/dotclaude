# Every push runs the self-tests on a clean machine, where this checkout is
# ~/.claude, the tree the scripts were written for. The showcase page reads
# this run's result and shows it beside the claims the tests prove.
name: selftest
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Make this checkout ~/.claude
        run: rm -rf "$HOME/.claude" && ln -s "$GITHUB_WORKSPACE" "$HOME/.claude"
      # The tools the self-tests run on, at the versions they run on at home:
      # the pinned shellcheck, ReportLab for gist.py, uv for the parser
      # gh-pr-structure.sh fetches.
      - name: Install what the self-tests need
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.claude/scripts/install_shellcheck.sh
          sudo apt-get install -y -qq python3-reportlab
          pipx install uv==0.10.3
      - name: Run every self-test
        run: ~/.claude/scripts/selftest.sh --copy
